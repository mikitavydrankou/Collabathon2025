name: Build & push images

# Builds every service/worker image and pushes to GitHub Container Registry
# (ghcr.io). Auth uses the built-in GITHUB_TOKEN — no extra secrets needed.

on:
  push:
    branches: [next-gen, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: collabathon2025-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=
          - image: collabathon2025-auth-svc
            context: .
            dockerfile: services/auth-svc/Dockerfile
          - image: collabathon2025-transactions-svc
            context: .
            dockerfile: services/transactions-svc/Dockerfile
          - image: collabathon2025-chatbot-svc
            context: .
            dockerfile: services/chatbot-svc/Dockerfile
          - image: collabathon2025-qa-svc
            context: .
            dockerfile: services/qa-svc/Dockerfile
          - image: collabathon2025-embedding-worker
            context: .
            dockerfile: workers/embedding-worker/Dockerfile
          - image: collabathon2025-anomaly-worker
            context: .
            dockerfile: workers/anomaly-worker/Dockerfile
          - image: collabathon2025-outbox-relay
            context: .
            dockerfile: workers/outbox-relay/Dockerfile
          - image: collabathon2025-mcp
            context: .
            dockerfile: mcp_server/Dockerfile
          - image: collabathon2025-migrate
            context: .
            dockerfile: migrate/Dockerfile
          - image: collabathon2025-seed
            context: .
            dockerfile: seed/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
