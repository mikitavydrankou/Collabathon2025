name: CI/CD

# Pipeline: test -> build -> deploy (GitOps).
#   1. test    — pytest unit suite; nothing builds if it fails.
#   2. build   — every image is rebuilt and pushed to ghcr.io (+ Artifact
#                Registry when GCP_PROJECT_ID is configured) tagged :latest and
#                :<commit-sha>, then Trivy-scanned. All images are built (not
#                just changed ones) so the :<sha> tag is a complete, coherent
#                snapshot — the deploy step pins the whole chart to it, and a
#                partial build would leave some Deployments pointing at a tag
#                that was never pushed. Layer cache keeps unchanged images cheap.
#   3. deploy  — pins image.tag in deploy/helm/easyfocus/values-gke.yaml to the
#                commit SHA and pushes that change back to the branch. Argo CD
#                watches the repo, sees the diff and rolls the cluster to
#                exactly this build. Rollback = git revert of the pin commit.
#                No retrigger loop: pushes made with GITHUB_TOKEN do not start
#                new workflow runs.
#
# Auth: ghcr uses the built-in GITHUB_TOKEN; Artifact Registry is keyless via
# Workload Identity Federation (repo vars GCP_PROJECT_ID, GCP_WIF_PROVIDER,
# GCP_DEPLOY_SA; optional GCP_REGION, AR_REPO).

on:
  push:
    branches: [next-gen, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# One pipeline per branch at a time; a queued run supersedes older queued ones.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1. tests gate everything ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest \
            numpy \
            sqlalchemy \
            python-dotenv \
            "python-jose[cryptography]" \
            bcrypt \
            fastapi \
            psycopg2-binary

      - name: Run tests
        env:
          PYTHONPATH: shared-lib
          JWT_SECRET: test-secret
          DATABASE_USERNAME: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: test
        run: pytest

  # ---- 2. build & push all images ----
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # mint the OIDC token for GCP Workload Identity Federation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: collabathon2025-frontend,         context: ./frontend, dockerfile: ./frontend/Dockerfile,              build_args: "NEXT_PUBLIC_API_URL=" }
          - { image: collabathon2025-auth-svc,         context: .,          dockerfile: services/auth-svc/Dockerfile,         build_args: "" }
          - { image: collabathon2025-transactions-svc, context: .,          dockerfile: services/transactions-svc/Dockerfile, build_args: "" }
          - { image: collabathon2025-chatbot-svc,      context: .,          dockerfile: services/chatbot-svc/Dockerfile,      build_args: "" }
          - { image: collabathon2025-qa-svc,           context: .,          dockerfile: services/qa-svc/Dockerfile,           build_args: "" }
          - { image: collabathon2025-embedding-worker, context: .,          dockerfile: workers/embedding-worker/Dockerfile,  build_args: "" }
          - { image: collabathon2025-anomaly-worker,   context: .,          dockerfile: workers/anomaly-worker/Dockerfile,    build_args: "" }
          - { image: collabathon2025-outbox-relay,     context: .,          dockerfile: workers/outbox-relay/Dockerfile,      build_args: "" }
          - { image: collabathon2025-mcp,              context: .,          dockerfile: mcp_server/Dockerfile,                build_args: "" }
          - { image: collabathon2025-migrate,          context: .,          dockerfile: migrate/Dockerfile,                   build_args: "" }
          - { image: collabathon2025-seed,             context: .,          dockerfile: seed/Dockerfile,                      build_args: "" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP
        id: gcpauth
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Log in to Artifact Registry
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION || 'europe-central2' }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcpauth.outputs.access_token }}

      # Assemble the tag list: always ghcr, plus Artifact Registry when configured.
      - name: Compose image tags
        id: tags
        env:
          OWNER: ${{ steps.owner.outputs.name }}
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AR_REPO: ${{ vars.AR_REPO }}
        run: |
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${OWNER}/${IMAGE}:latest"
            echo "${REGISTRY}/${OWNER}/${IMAGE}:${SHA}"
            if [ -n "$GCP_PROJECT_ID" ]; then
              AR_HOST="${GCP_REGION:-europe-central2}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO:-easyfocus}"
              echo "${AR_HOST}/${IMAGE}:latest"
              echo "${AR_HOST}/${IMAGE}:${SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Scan the freshly-pushed image for known CVEs. Run Trivy from its own
      # container (avoids the trivy-action transitive setup-trivy tag breakage).
      # Report-only for now (--exit-code 0); set it to 1 to fail on CRITICAL/HIGH.
      - name: Trivy scan ${{ matrix.image }}
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            "${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}"

  # ---- 3. GitOps deploy: pin the chart to this build, Argo does the rest ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pin image.tag to ${{ github.sha }}
        run: |
          sed -i "s|^  tag: .*|  tag: ${GITHUB_SHA}|" deploy/helm/easyfocus/values-gke.yaml
          if git diff --quiet; then
            echo "values-gke.yaml already at ${GITHUB_SHA} — nothing to deploy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/easyfocus/values-gke.yaml
          git commit -m "ci: deploy ${GITHUB_SHA::7} (pin image.tag for Argo CD)"
          # tolerate a racing push between checkout and now
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
