events {}

http {
    # Rate-limit zones keyed by client IP. Behind a cloud LB, set real_ip from the
    # LB range so the key is the visitor, not the LB. AI zones are strict because
    # each request costs an OpenAI call.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ai:10m      rate=20r/m;
    limit_req_zone $binary_remote_addr zone=write:10m   rate=30r/m;
    limit_req_status 429;

    server {
        listen 8000;

        # Resolve upstreams at runtime via Docker DNS so recreated containers
        # (new IPs) are picked up without restarting the gateway. Hosts must be
        # in variables to force per-request resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth "auth-svc:8000";
        set $tx   "transactions-svc:8000";
        set $chat "chatbot-svc:8000";
        set $qa   "qa-svc:8000";

        # Baseline limit for all traffic.
        limit_req zone=general burst=40 nodelay;

        # Gateway liveness.
        location = /health {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"gateway":"ok"}';
        }

        # Per-service health, surfaced for the in-app System status page.
        location = /status/auth         { proxy_pass http://$auth/health; }
        location = /status/transactions { proxy_pass http://$tx/health; }
        location = /status/chatbot      { proxy_pass http://$chat/health; }
        location = /status/qa           { proxy_pass http://$qa/health; }

        # Live LLM daily-budget counter for the System status page.
        location = /status/usage        { proxy_pass http://$qa/usage; }

        # Demo data reset, triggered from the in-app System status page.
        location = /admin/reset-db {
            limit_req zone=write burst=5 nodelay;
            proxy_pass http://$tx/admin/reset-db;
        }

        location /auth/ { proxy_pass http://$auth; }

        # AI endpoints: tight limit to protect the OpenAI budget.
        location /chatbot/ {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://$chat;
        }
        location /qa/ {
            limit_req zone=ai burst=5 nodelay;
            proxy_pass http://$qa;
        }

        # Money creation: tighter than baseline.
        location = /transactions/create {
            limit_req zone=write burst=10 nodelay;
            proxy_pass http://$tx;
        }
        location /transactions/ { proxy_pass http://$tx; }

        # utils router (no prefix) lives in transactions-svc.
        location /validate_amount      { proxy_pass http://$tx; }
        location /validate_bank_number { proxy_pass http://$tx; }
        location /validate_fullname    { proxy_pass http://$tx; }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
