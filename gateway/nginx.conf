events {}

http {
    # Per-service upstreams (all uvicorn apps listen on :8000 inside their container).
    upstream auth_svc         { server auth-svc:8000; }
    upstream transactions_svc { server transactions-svc:8000; }
    upstream chatbot_svc      { server chatbot-svc:8000; }
    upstream qa_svc           { server qa-svc:8000; }

    server {
        listen 8000;

        # Gateway liveness.
        location = /health {
            add_header Content-Type application/json;
            return 200 '{"gateway":"ok"}';
        }

        location /auth/         { proxy_pass http://auth_svc; }
        location /chatbot/      { proxy_pass http://chatbot_svc; }
        location /qa/           { proxy_pass http://qa_svc; }
        location /transactions/ { proxy_pass http://transactions_svc; }

        # utils router (no prefix) lives in transactions-svc.
        location /validate_amount      { proxy_pass http://transactions_svc; }
        location /validate_bank_number { proxy_pass http://transactions_svc; }
        location /validate_fullname    { proxy_pass http://transactions_svc; }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
