# Default values for the EasyFocus chart.
# Secrets (OPENAI_API_KEY etc.) live in values-local.yaml — NOT committed.

image:
  registry: ghcr.io/mikitavydrankou
  tag: latest
  pullPolicy: Always

# CoreDNS ClusterIP — used by the gateway nginx resolver for runtime upstream
# resolution. Default kind/k8s service CIDR puts kube-dns at .10.
clusterDNS: "10.96.0.10"

# Default compute for Python backends/workers. Requests sized for idle (services
# are light: FastAPI + langchain-openai API client, no local ML). Limits give
# burst headroom. Override per-workload via `resources` under backends/workers.
defaultResources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Non-secret env, mounted into every backend/worker via envFrom configMap.
config:
  DB_HOST: postgres
  DB_PORT: "5432"
  DATABASE_NAME: your_database_name
  MCP_SERVER_URL: http://mcp:8001
  KAFKA_BROKERS: kafka:9092
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: "*"
  OPENAI_DAILY_LIMIT: "50"
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  SEED_ON_START: "true"
  # glibc malloc spawns an arena per thread; uncapped this bloats Python RSS 2-3x.
  # Mounted into every backend/worker/job via the configMap envFrom.
  MALLOC_ARENA_MAX: "2"
  # OTLP/gRPC endpoint for traces. Empty disables tracing (shared.tracing is a
  # no-op). Points at the Tempo Argo app (deploy/argo/tempo.yaml) in ns monitoring.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.monitoring.svc.cluster.local:4317
  # Drop liveness/readiness + metrics scrape spans so traces show real traffic,
  # not kubelet/Prometheus probe noise (matched as substrings of the path).
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "health,metrics,usage"

# Render the easyfocus-secret from `.secret` below. true for a local helm
# render (creds come from gitignored values-local.yaml). Set false under Argo:
# Argo syncs from git where values-local.yaml is absent, so it would otherwise
# overwrite the live secret with the placeholders here. Manage easyfocus-secret
# out-of-band in that mode (same as alertmanager-telegram).
createSecret: true

# Secret env. Override OPENAI_API_KEY (and ideally creds/JWT) in values-local.yaml.
secret:
  DATABASE_USERNAME: your_username
  DATABASE_PASSWORD: your_password
  JWT_SECRET: change_me_use_a_long_random_string
  OPENAI_API_KEY: ""

# HTTP backend services (built images, listen on :8000 unless noted).
backends:
  auth-svc:
    image: collabathon2025-auth-svc
    port: 8000
    metrics: true   # app_factory exposes /metrics (prometheus-fastapi-instrumentator)
  transactions-svc:
    image: collabathon2025-transactions-svc
    port: 8000
    metrics: true
  chatbot-svc:
    image: collabathon2025-chatbot-svc
    port: 8000
    metrics: true
  qa-svc:
    image: collabathon2025-qa-svc
    port: 8000
    metrics: true
  mcp:
    image: collabathon2025-mcp
    port: 8001
    probe: false   # no /health endpoint confirmed

# Kafka consumers / outbox relay — no service, no HTTP port.
workers:
  embedding-worker:
    image: collabathon2025-embedding-worker
  anomaly-worker:
    image: collabathon2025-anomaly-worker
  outbox-relay:
    image: collabathon2025-outbox-relay

frontend:
  image: collabathon2025-frontend
  port: 3000
  # Same-origin: empty = relative URLs, edge routes /auth, /qa, ... to gateway.
  # NOTE: this is baked at BUILD time (NEXT_PUBLIC_*), so it must match the image
  # build-arg; the runtime env below is belt-and-suspenders for SSR only.
  apiUrl: ""
  # Bounds the V8 old-space so the standalone server.js can't balloon.
  nodeMaxOldSpaceMB: 192
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

gateway:
  port: 8000
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Stateful infra. Pulled from public images, not built.
infra:
  postgres:
    image: postgres:17
    storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
  redis:
    image: redis:7-alpine
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  kafka:
    image: apache/kafka:3.9.0
    storage: 1Gi
    # Cap the JVM heap. Without this, JVM ergonomics default MaxHeap to ~25% of
    # node RAM (GBs on a big node) for a broker that needs far less here.
    heapOpts: "-Xmx512m -Xms256m"
    resources:
      requests:
        cpu: 100m
        memory: 640Mi
      limits:
        # heap 512m + JVM non-heap (metaspace/threads/direct buffers) headroom.
        cpu: 1000m
        memory: 1Gi
  chroma:
    image: chromadb/chroma:latest
    storage: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 384Mi

# Gateway API edge (ingress-nginx retired 2026-03-24 → migrated to Gateway API).
# Single-origin: one host serves UI + API (path-split to frontend / gateway).
# className is the only thing that changes kind → GKE; HTTPRoute stays identical.
edge:
  enabled: true
  className: eg            # Envoy Gateway. On GKE swap to gke-l7-* (values-gke.yaml).
  host: easyfocus.local
  # Extra accepted Host headers. `localhost` lets the browser hit the kind
  # port-forward at http://localhost:<port> with no hosts-file edit.
  extraHostnames:
    - localhost
  # Pin the LB to a reserved static IP by name (GKE only). Empty = let the
  # controller allocate (kind/Envoy has no cloud LB anyway).
  gatewayAddressName: ""
  # TLS termination at the edge. Off on kind (plain HTTP). On GKE: values-gke.yaml
  # flips enabled=true; cert-manager fills the secretName Secret, :80 -> 301 https.
  tls:
    enabled: false
    secretName: easyfocus-tls

# kafka-ui / pgweb — off by default.
devtools:
  enabled: false

# Prometheus Operator ServiceMonitors for the FastAPI backends (metrics: true).
# Requires the monitoring.coreos.com CRDs (kube-prometheus-stack) in the cluster.
monitoring:
  serviceMonitors: true
  # kafka-exporter (consumer lag) + postgres-exporter, deployed alongside the app.
  exporters: true
  # Cosmetic label only; Prometheus picks ServiceMonitors via empty selector.
  releaseLabel: kube-prometheus-stack
  # Custom Grafana dashboard ConfigMap (templates/grafana-dashboard.yaml).
  dashboard: true
  # Loki datasource ConfigMap for Grafana (templates/grafana-datasource-loki.yaml).
  # Requires the Loki Argo app (deploy/argo/loki.yaml) running in ns monitoring.
  loki: true
  # Tempo datasource ConfigMap for Grafana (templates/grafana-datasource-tempo.yaml).
  # Requires the Tempo Argo app (deploy/argo/tempo.yaml) running in ns monitoring.
  tempo: true
  # PrometheusRule alerts (templates/prometheus-rules.yaml).
  alerts: true
