apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
data:
  nginx.conf: |
    events {}

    http {
        limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
        limit_req_zone $binary_remote_addr zone=ai:10m      rate=20r/m;
        limit_req_zone $binary_remote_addr zone=write:10m   rate=30r/m;
        limit_req_status 429;

        server {
            listen {{ .Values.gateway.port }};

            # k8s cluster DNS for runtime upstream resolution (Services are stable
            # but variables + resolver avoid boot-time resolution failures).
            resolver {{ .Values.clusterDNS }} valid=10s ipv6=off;
            # FQDN required: nginx resolver does not apply resolv.conf search domains.
            set $auth "auth-svc.{{ .Release.Namespace }}.svc.cluster.local:8000";
            set $tx   "transactions-svc.{{ .Release.Namespace }}.svc.cluster.local:8000";
            set $chat "chatbot-svc.{{ .Release.Namespace }}.svc.cluster.local:8000";
            set $qa   "qa-svc.{{ .Release.Namespace }}.svc.cluster.local:8000";

            limit_req zone=general burst=40 nodelay;

            location = /health {
                add_header Content-Type application/json;
                add_header Access-Control-Allow-Origin *;
                return 200 '{"gateway":"ok"}';
            }

            location = /status/auth         { proxy_pass http://$auth/health; }
            location = /status/transactions { proxy_pass http://$tx/health; }
            location = /status/chatbot      { proxy_pass http://$chat/health; }
            location = /status/qa           { proxy_pass http://$qa/health; }
            location = /status/usage        { proxy_pass http://$qa/usage; }

            location = /admin/reset-db {
                limit_req zone=write burst=5 nodelay;
                proxy_pass http://$tx/admin/reset-db;
            }

            location /auth/ { proxy_pass http://$auth; }

            location /chatbot/ {
                limit_req zone=ai burst=5 nodelay;
                proxy_pass http://$chat;
            }
            location /qa/ {
                limit_req zone=ai burst=5 nodelay;
                proxy_pass http://$qa;
            }

            location = /transactions/create {
                limit_req zone=write burst=10 nodelay;
                proxy_pass http://$tx;
            }
            location /transactions/ { proxy_pass http://$tx; }

            location /validate_amount      { proxy_pass http://$tx; }
            location /validate_bank_number { proxy_pass http://$tx; }
            location /validate_fullname    { proxy_pass http://$tx; }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:alpine
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
