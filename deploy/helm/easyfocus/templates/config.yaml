apiVersion: v1
kind: ConfigMap
metadata:
  name: easyfocus-config
data:
{{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- if .Values.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: easyfocus-secret
type: Opaque
stringData:
{{- range $k, $v := .Values.secret }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
