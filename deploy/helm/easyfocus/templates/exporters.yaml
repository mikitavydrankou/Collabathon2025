{{- if .Values.monitoring.exporters }}
# Kafka exporter — consumer-group lag (embedding-worker, anomaly-worker) + broker
# topic offsets. Scraped by Prometheus via the ServiceMonitor below.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args:
            - --kafka.server={{ .Values.config.KAFKA_BROKERS }}
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  labels:
    app: kafka-exporter
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
---
# Postgres exporter — connection/transaction/table stats. Reuses the app's
# DB host/name (configMap) and credentials (secret); no creds duplicated here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          env:
            - name: DATA_SOURCE_URI
              value: "{{ .Values.config.DB_HOST }}:{{ .Values.config.DB_PORT }}/{{ .Values.config.DATABASE_NAME }}?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: easyfocus-secret
                  key: DATABASE_USERNAME
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: easyfocus-secret
                  key: DATABASE_PASSWORD
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 256Mi
            limits:
              # 200m (was 100m) — exporter throttled ~27% at 100m under scrape load
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
{{- if .Values.monitoring.serviceMonitors }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  labels:
    app: kafka-exporter
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  selector:
    matchLabels:
      app: kafka-exporter
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  labels:
    app: postgres-exporter
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: metrics
      interval: 15s
{{- end }}
{{- end }}
