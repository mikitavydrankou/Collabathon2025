{{- if .Values.edge.enabled }}
{{- $tls := .Values.edge.tls | default dict }}
# Single-origin edge. One hostname serves the SPA and the API: backend path
# prefixes go to the nginx app-gateway, everything else to the Next.js frontend.
# No CORS, one TLS cert. The frontend bundle is built with NEXT_PUBLIC_API_URL=""
# so it calls these paths same-origin.
#
# kind  : HTTP only (edge.tls.enabled=false), className eg (Envoy Gateway).
# GKE   : HTTPS (edge.tls.enabled=true) on a managed L7 LB (gke-l7-* class),
#         HTTP :80 redirects to :443; cert lives in the edge.tls.secretName Secret
#         (filled by cert-manager). See values-gke.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: easyfocus
spec:
  gatewayClassName: {{ .Values.edge.className }}
  {{- with .Values.edge.gatewayAddressName }}
  # Pin the LB to the reserved static IP (Terraform google_compute_global_address)
  # so the DuckDNS A-record never has to change.
  addresses:
    - type: NamedAddress
      value: {{ . | quote }}
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if $tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.edge.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $tls.secretName | default "easyfocus-tls" }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: easyfocus
spec:
  parentRefs:
    - name: easyfocus
      {{- if $tls.enabled }}
      # Serve traffic on the TLS listener; :80 only redirects (route below).
      sectionName: https
      {{- end }}
  hostnames:
    - {{ .Values.edge.host | quote }}
{{- range .Values.edge.extraHostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    # Backend prefixes -> nginx app-gateway (longest-prefix wins over "/").
    - matches:
        - path: { type: PathPrefix, value: /auth }
        - path: { type: PathPrefix, value: /chatbot }
        - path: { type: PathPrefix, value: /qa }
        - path: { type: PathPrefix, value: /transactions }
        - path: { type: PathPrefix, value: /validate_amount }
        - path: { type: PathPrefix, value: /validate_bank_number }
        - path: { type: PathPrefix, value: /validate_fullname }
        - path: { type: PathPrefix, value: /health }
        - path: { type: PathPrefix, value: /status }
        - path: { type: PathPrefix, value: /admin }
      backendRefs:
        - name: gateway
          port: {{ .Values.gateway.port }}
    # Everything else -> Next.js frontend (UI, /_next assets, etc.).
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: {{ .Values.frontend.port }}
{{- if $tls.enabled }}
---
# Plain :80 -> 301 to https. Bound to the HTTP listener only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: easyfocus-https-redirect
spec:
  parentRefs:
    - name: easyfocus
      sectionName: http
  hostnames:
    - {{ .Values.edge.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
