{{- if .Values.edge.enabled }}
# Single-origin edge. One hostname serves the SPA and the API: backend path
# prefixes go to the nginx app-gateway, everything else to the Next.js frontend.
# No CORS, one TLS cert. The frontend bundle is built with NEXT_PUBLIC_API_URL=""
# so it calls these paths same-origin.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: easyfocus
spec:
  gatewayClassName: {{ .Values.edge.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: easyfocus
spec:
  parentRefs:
    - name: easyfocus
  hostnames:
    - {{ .Values.edge.host | quote }}
{{- range .Values.edge.extraHostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    # Backend prefixes -> nginx app-gateway (longest-prefix wins over "/").
    - matches:
        - path: { type: PathPrefix, value: /auth }
        - path: { type: PathPrefix, value: /chatbot }
        - path: { type: PathPrefix, value: /qa }
        - path: { type: PathPrefix, value: /transactions }
        - path: { type: PathPrefix, value: /validate_amount }
        - path: { type: PathPrefix, value: /validate_bank_number }
        - path: { type: PathPrefix, value: /validate_fullname }
        - path: { type: PathPrefix, value: /health }
        - path: { type: PathPrefix, value: /status }
        - path: { type: PathPrefix, value: /admin }
      backendRefs:
        - name: gateway
          port: {{ .Values.gateway.port }}
    # Everything else -> Next.js frontend (UI, /_next assets, etc.).
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: {{ .Values.frontend.port }}
{{- end }}
