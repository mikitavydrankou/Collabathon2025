# GKE production overlay. Layer on top of the base values:
#   helm upgrade --install easyfocus . -f values.yaml -f values-gke.yaml -f values-local.yaml
# (Argo: add this file to the Application's helm.valueFiles — see deploy/argo.)
#
# Only the cloud-specific deltas live here; everything else stays as values.yaml.
# Fill the two <PLACEHOLDERS> from `terraform output` after `terraform apply`.

# GKE service CIDR puts kube-dns at 10.8.0.10 (kind: 10.96.0.10). The gateway
# nginx resolver needs the right one or every proxy_pass hangs on DNS while
# /health (a plain `return 200`) keeps the LB health check green — requests
# then time out with a HEALTHY backend.
# Value = `kubectl -n kube-system get svc kube-dns -o jsonpath={.spec.clusterIP}`
clusterDNS: "10.8.0.10"

# Pull images from Artifact Registry instead of ghcr.
# Value = `terraform output -raw artifact_registry_host`
#   <region>-docker.pkg.dev/<project>/easyfocus
image:
  registry: europe-central2-docker.pkg.dev/project-20a72ce3-6c66-473c-89e/easyfocus
  # Pin to a git SHA in CI/Argo for reproducible deploys; `latest` ok for manual.
  tag: latest

# Cost-cutting: the in-cluster observability stack (kube-prometheus-stack,
# Loki, Promtail, Tempo) is removed on GKE — it requested ~half the cluster's
# resources (~1-2 e2-standard-2 nodes) and the Free Trial credits are finite.
# GKE's built-in Cloud Logging/Monitoring still covers logs and node metrics.
# Everything below renders monitoring.coreos.com CRs or Grafana ConfigMaps that
# would break (or be orphaned) without that stack. Re-enable by deleting these
# overrides and `kubectl apply -f deploy/argo/`.
monitoring:
  serviceMonitors: false
  exporters: false
  dashboard: false
  loki: false
  tempo: false
  alerts: false

config:
  # No Tempo to ship spans to; empty disables tracing (shared.tracing no-op).
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

edge:
  # Managed external L7 load balancer (Google), global. Pairs with the global
  # static IP reserved in Terraform.
  className: gke-l7-global-external-managed
  # Your DuckDNS hostname. Must match the cert dnsNames (deploy/gke/certificate.yaml).
  host: easyfocus.duckdns.org
  # No localhost on a public cert — public host only.
  extraHostnames: []
  # `terraform output -raw edge_ip_name` (defaults to "<cluster_name>-ip").
  gatewayAddressName: easyfocus-ip
  tls:
    enabled: true
    secretName: easyfocus-tls   # cert-manager writes the LE cert here
