# cert-manager as an Argo Application. Issues + auto-renews the Let's Encrypt
# cert for the edge. Gateway API support is behind a feature gate, enabled here
# so the HTTP-01 solver can spin up a temporary HTTPRoute on our Gateway.
#
# Apply path: deploy/gke bootstrap applies this, then clusterissuer.yaml +
# certificate.yaml once cert-manager's CRDs are Established.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      values: |
        crds:
          enabled: true
        # Leader-election leases default to kube-system, which Autopilot's
        # Warden makes read-only — controllers then spin on "cannot create
        # leases" and the webhook CA never gets injected.
        global:
          leaderElection:
            namespace: cert-manager
        # Gateway API HTTP-01 solver (creates a transient HTTPRoute).
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
        # Explicit requests: Autopilot defaults unset requests to
        # 0.5 vCPU / 2Gi / 1Gi-ephemeral per container — three controllers'
        # worth of that neither fits the frugal nodes nor the trial budget.
        resources: &cmres
          requests:
            cpu: 25m
            memory: 64Mi
            ephemeral-storage: 128Mi
          limits:
            memory: 256Mi
            ephemeral-storage: 128Mi
        webhook:
          resources: *cmres
        cainjector:
          resources: *cmres
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
