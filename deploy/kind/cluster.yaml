# kind cluster for the EasyFocus k8s lab.
# Single control-plane node, set up so ingress-nginx can bind host :80/:443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: easyfocus
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
