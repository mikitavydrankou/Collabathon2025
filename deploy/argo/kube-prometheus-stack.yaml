apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.2
    helm:
      values: |
        # --- Prometheus: pick up ServiceMonitors/PodMonitors from ANY namespace,
        # not only those carrying the chart's release label. Needed so the
        # EasyFocus app ServiceMonitors (namespace: default) are scraped.
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            ruleSelectorNilUsesHelmValues: false
            ruleSelector: {}
            retention: 6h
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi
        # --- Grafana: light, admin/admin for the demo (local kind only).
        grafana:
          adminPassword: admin
          # The dashboard/datasource sidecars default to watching only Grafana's
          # own namespace (monitoring). EasyFocus ships its dashboard + Loki
          # datasource ConfigMaps from the app chart (namespace: default), so
          # widen the search to ALL namespaces.
          sidecar:
            dashboards:
              searchNamespace: ALL
            datasources:
              searchNamespace: ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # 256Mi OOMKilled once the Tempo datasource + trace search (bleve)
              # were added alongside Prometheus/Loki. 512Mi holds the 3 datasources.
              memory: 512Mi
        alertmanager:
          alertmanagerSpec:
            # Mounts Secret `alertmanager-telegram` (key `token`) at
            # /etc/alertmanager/secrets/alertmanager-telegram/token. The bot token
            # lives ONLY in that Secret (created out-of-band via kubectl), never
            # in git. Rotate it at @BotFather if it leaks.
            secrets:
              - alertmanager-telegram
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
          # Telegram routing for EasyFocus alerts (PrometheusRule easyfocus-alerts).
          # Token is read from the mounted Secret via bot_token_file (Alertmanager
          # >=0.26). chat_id is a private chat — not sensitive, safe in git.
          config:
            route:
              # Default = blackhole. Only warning|critical reach Telegram so the
              # chat isn't spammed by the chart's Watchdog (severity=none) and
              # info-level rules (e.g. CPUThrottlingHigh).
              receiver: "null"
              group_by: ['alertname', 'job']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 3h
              routes:
                - receiver: telegram
                  matchers: ['severity=~"warning|critical"']
            receivers:
              - name: "null"
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
                    chat_id: 1055072436
                    parse_mode: HTML
                    send_resolved: true
        # Trim components that don't exist / aren't useful on a single-node kind.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
