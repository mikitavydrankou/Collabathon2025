apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: 6.16.6
    helm:
      values: |
        # TODO: Promtail is EOL since 2026-03-02 — migrate to Grafana Alloy
        # (https://grafana.com/docs/loki/latest/setup/migrate/migrate-to-alloy/)
        # or drop log collection entirely in the cost-cutting pass.
        #
        # DaemonSet tailing every pod's stdout/stderr and pushing to Loki.
        # Loki runs in the same namespace (monitoring), so the in-cluster DNS
        # name `loki` resolves directly.
        #
        # GKE Autopilot (Warden) forbids write-mode hostPath volumes and only
        # allows hostPath under /var/log/. The chart's default volumes mount
        # /var/lib/docker/containers and a writable /run/promtail, so both are
        # replaced: logs come from read-only /var/log/pods (containerd layout)
        # and the positions file lives in an emptyDir.
        defaultVolumes:
          - name: pods
            hostPath:
              path: /var/log/pods
          - name: positions
            emptyDir: {}
        defaultVolumeMounts:
          - name: pods
            mountPath: /var/log/pods
            readOnly: true
          - name: positions
            mountPath: /run/promtail
        # The monitoring namespace defaults to the frugal ComputeClass, so GKE
        # injects nodeSelector compute-class=frugal into every new pod. The DS
        # pod aimed at the one untainted (non-frugal) node can then never
        # schedule — pin the DS to frugal nodes so desired==ready and the app
        # turns Healthy. That node only runs kube-system (Cloud Logging covers it).
        nodeSelector:
          cloud.google.com/compute-class: frugal
        # The frugal-ComputeClass nodes carry a NoSchedule taint; without this
        # toleration the DaemonSet only targets the single untainted node and
        # collects no logs from the app workloads.
        tolerations:
          - key: cloud.google.com/compute-class
            operator: Equal
            value: frugal
            effect: NoSchedule
        config:
          positions:
            filename: /run/promtail/positions.yaml
          clients:
            - url: http://loki:3100/loki/api/v1/push
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
            ephemeral-storage: 256Mi
          limits:
            # 128Mi OOMKilled once promtail tails every pod on a node (it only
            # reached the app nodes after the frugal-taint toleration).
            memory: 256Mi
            ephemeral-storage: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
