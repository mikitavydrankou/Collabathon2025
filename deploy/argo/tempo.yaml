apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.18.0
    helm:
      values: |
        # Single-binary Tempo — one pod, filesystem storage. Lightweight for a
        # single-node kind cluster; NOT for production (no HA, no object store).
        tempo:
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
          # Enable OTLP receivers so services/workers can push spans over gRPC
          # (4317) and HTTP (4318). The chart exposes these on the tempo service.
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          retention: 24h
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              # 512Mi restarted (503) under trace ingest + search; 1Gi is stable
              # for a single-binary demo Tempo.
              memory: 1Gi
        persistence:
          enabled: true
          size: 5Gi
          storageClass: standard
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
