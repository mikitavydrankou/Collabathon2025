# EasyFocus app under Argo GitOps. Renders the in-repo Helm chart
# (deploy/helm/easyfocus) straight from git — no more manual `helm upgrade`.
#
# createSecret=false: values-local.yaml (the real creds) is gitignored, so Argo
# can't see it. Without this flag the chart would render easyfocus-secret from
# the placeholder values in values.yaml and clobber the live secret. Manage
# easyfocus-secret out-of-band (kubectl), same pattern as alertmanager-telegram.
#
# Repo is public, so it's pulled over https with no credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easyfocus
  namespace: argocd
  annotations:
    # Argo v3 defaults to ServerSideDiff when ServerSideApply is on. The GKE
    # Gateway admission chain mutates the object differently under dry-run, so
    # SSDiff flags the Gateway as permanently OutOfSync (apply "succeeds", the
    # very next compare drifts again — visible as selfHeal retry loops).
    # Classic diff on the same state is clean.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mikitavydrankou/Collabathon2025.git
    targetRevision: next-gen
    path: deploy/helm/easyfocus
    helm:
      # Chart values.yaml is auto-loaded; override only what GitOps needs.
      valueFiles:
        - values-gke.yaml
      parameters:
        - name: createSecret
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # The API server / Gateway controller default-fill these fields; the chart omits
  # them, so Argo would report a permanent OutOfSync. All are immutable or
  # controller-owned, so ignoring them is safe.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.persistentVolumeClaimRetentionPolicy
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.parentRefs[].sectionName
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
        - .spec.rules[].filters[].requestRedirect.statusCode
        - .spec.rules[].matches
    # The GKE Gateway controller writes a dozen networking.gke.io/* status
    # annotations (incl. last-reconcile-time, which changes on every reconcile)
    # onto the Gateway — permanent OutOfSync unless ignored wholesale.
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - .metadata.annotations
        - .spec.addresses[].type
        # API server persists certificateRefs[].group as "" but a dry-run apply
        # omits it — ServerSideDiff-style comparison drifts on it forever.
        # select(.tls): plain .tls.certificateRefs[] errors on the non-TLS http
        # listener ("Cannot iterate over null") and Argo then silently drops
        # the whole expression.
        - .spec.listeners[] | select(.tls) | .tls.certificateRefs[].group
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
