x-backend-base: &backend-base
  restart: unless-stopped
  env_file:
    - .env
  environment: &backend-env
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DATABASE_NAME: ${DATABASE_NAME}
    DATABASE_USERNAME: ${DATABASE_USERNAME}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    MCP_SERVER_URL: http://mcp:8001
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    JWT_SECRET: ${JWT_SECRET}
    CORS_ORIGINS: ${CORS_ORIGINS}
    KAFKA_BROKERS: kafka:9092
    REDIS_URL: redis://redis:6379/0
    OPENAI_DAILY_LIMIT: ${OPENAI_DAILY_LIMIT:-500}
  depends_on:
    db:
      condition: service_healthy
  networks:
    - collabathon-net

services:
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - gateway
    networks:
      - collabathon-net

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - auth-svc
      - transactions-svc
      - chatbot-svc
      - qa-svc
    networks:
      - collabathon-net

  auth-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/auth-svc/Dockerfile
    environment:
      <<: *backend-env
      SEED_ON_START: ${SEED_ON_START}

  transactions-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/transactions-svc/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  chatbot-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/chatbot-svc/Dockerfile

  qa-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/qa-svc/Dockerfile
    environment:
      <<: *backend-env
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    networks:
      - collabathon-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - collabathon-net

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - collabathon-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    networks:
      - collabathon-net

  embedding-worker:
    build:
      context: .
      dockerfile: workers/embedding-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      - kafka
      - chroma
    networks:
      - collabathon-net

  anomaly-worker:
    build:
      context: .
      dockerfile: workers/anomaly-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - collabathon-net

  outbox-relay:
    build:
      context: .
      dockerfile: workers/outbox-relay/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - collabathon-net

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - collabathon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    restart: always
    ports:
      - "8080:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - collabathon-net

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - collabathon-net

volumes:
  postgres_data:
  chroma_data:
  kafka_data:

networks:
  collabathon-net:
    driver: bridge
