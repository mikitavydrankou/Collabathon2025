x-backend-base: &backend-base
  restart: unless-stopped
  env_file:
    - .env
  environment: &backend-env
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DATABASE_NAME: ${DATABASE_NAME}
    DATABASE_USERNAME: ${DATABASE_USERNAME}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    MCP_SERVER_URL: http://mcp:8001
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    JWT_SECRET: ${JWT_SECRET}
    CORS_ORIGINS: ${CORS_ORIGINS}
  depends_on:
    db:
      condition: service_healthy
  networks:
    - collabathon-net

services:
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - gateway
    networks:
      - collabathon-net

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - auth-svc
      - transactions-svc
      - chatbot-svc
      - qa-svc
    networks:
      - collabathon-net

  auth-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/auth-svc/Dockerfile
    environment:
      <<: *backend-env
      SEED_ON_START: ${SEED_ON_START}

  transactions-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/transactions-svc/Dockerfile

  chatbot-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/chatbot-svc/Dockerfile

  qa-svc:
    <<: *backend-base
    build:
      context: .
      dockerfile: services/qa-svc/Dockerfile
    environment:
      <<: *backend-env
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    networks:
      - collabathon-net

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - collabathon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    restart: always
    ports:
      - "8080:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - collabathon-net

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - collabathon-net

volumes:
  postgres_data:
  chroma_data:

networks:
  collabathon-net:
    driver: bridge
