services:
    db:
        image: postgres:17
        environment:
            POSTGRES_DB: ${DATABASE_NAME}
            POSTGRES_USER: ${DATABASE_USERNAME}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file:
            - .env

    pgweb:
        image: sosedoff/pgweb
        restart: always
        ports:
            - "8080:8081"
        environment:
            - DATABASE_URL=postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?sslmode=disable
        depends_on:
            - db
        env_file:
            - .env

    mcp:
        build:
            context: ./backend
            dockerfile: Dockerfile.mcp
        restart: always
        ports:
            - "8001:8001"
        environment:
            DATABASE_NAME: ${DATABASE_NAME}
            DATABASE_USERNAME: ${DATABASE_USERNAME}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD}
            DB_HOST: db
            DB_PORT: 5432
        depends_on:
            - db
        env_file:
            - .env

volumes:
    postgres_data:
