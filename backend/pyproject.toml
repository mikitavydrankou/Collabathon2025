[project]
name = "backend"
version = "0.1.0"
description = "Beszketnyky collabothon 2025"
authors = [
    { name = "Bezketnyky", email = "boss@email.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "pydantic>=2.0.0",
    "numpy<2.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "pytest (>=9.0.1,<10.0.0)",
    "bcrypt>=4.0.0",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "chromadb>=0.4.0",
    "tiktoken>=0.5.0",
]

[tool.poetry]
packages = [
    {include = "backend", from = "src"},
    {include = "shared", from = ".."},
]

[tool.poetry.scripts]
start = "backend.main:start"
dev = "backend.main:dev"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
