[tool.poetry]
name = "mcp-server"
version = "1.0.0"
description = "MCP server exposing transaction tools over HTTP/stdio"
authors = ["Bezketnyky <boss@email.com>"]
packages = [{ include = "mcp_server", from = "." }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
shared = { path = "../shared-lib", develop = true }
mcp = ">=1.0.0"
uvicorn = { extras = ["standard"], version = ">=0.24.0" }
openai = ">=2.8.0,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
